
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinker</title>
    <link rel="stylesheet" href="tinker.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="content-layer">
        <div id="left-content-layer">
            <div id="main-header">
                <h1 class="gold-font">Tinker</h1>
            </div>
            <div id="sidebar-layer">
                <div id="sidebar"></div>
            </div>
        </div>
        <div id="right-content-layer">
            <div id="header">
                <div id="title-line">
                    <button id="sidebar-toggle"><img src="assets/back-arrow.png" alt="back"></button>
                    <h1 class="big-font" id="title"></h1>
                </div>
                <p id="description"></p>
            </div>
            <div id="main-content-layer">
                <div id="content"></div>
            </div>
        </div>
    </div>
</body>
</html>
